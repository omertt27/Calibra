<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!--
    Calibra Open Graph / social card — 1200×630.
    Matches the current landing page: monochrome dark theme, text-only "Calibra" wordmark.
    Source of truth for web/public/social-card.png (rasterize with scripts-free resvg render).
  -->
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#f5f5f5" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Ground -->
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Nav rule -->
  <line x1="0" y1="96" x2="1200" y2="96" stroke="#f5f5f5" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Wordmark (the logo) -->
  <text x="72" y="60" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="700" font-size="30" letter-spacing="-1.2" fill="#f2f2f0">Calibra</text>

  <!-- Nav-right eyebrow -->
  <text x="1128" y="59" text-anchor="end" font-family="'Menlo', 'DejaVu Sans Mono', monospace"
        font-size="13" letter-spacing="1.5" fill="#a3a3a0">DATASET OBSERVABILITY FOR ROBOT LEARNING</text>

  <!-- Eyebrow -->
  <g>
    <rect x="72" y="171" width="26" height="2" fill="#ffffff"/>
    <text x="112" y="178" font-family="'Menlo', 'DejaVu Sans Mono', monospace"
          font-size="14" letter-spacing="2.5" fill="#a3a3a0">SOURCE-AVAILABLE CLI FOR ROBOT LEARNING</text>
  </g>

  <!-- Headline -->
  <text x="70" y="290" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="600" font-size="76" letter-spacing="-1.6" fill="#f2f2f0">Stop wasting GPU hours</text>
  <!-- underline under "GPU hours" -->
  <rect x="533" y="304" width="300" height="4" fill="#ffffff"/>
  <text x="70" y="378" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="600" font-size="76" letter-spacing="-1.6" fill="#f2f2f0">on robot data.</text>

  <!-- Subhead -->
  <text x="72" y="452" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="400" font-size="26" letter-spacing="-0.2" fill="#a3a3a0">75% less training data. Prediction error within 0.8% of full-data training.</text>
  <text x="72" y="488" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="400" font-size="26" letter-spacing="-0.2" fill="#a3a3a0">Audit integrity, measure coverage, build quality-aware coresets.</text>

  <!-- Install chip -->
  <rect x="72" y="536" width="404" height="52" rx="10" fill="#131313" stroke="#f5f5f5" stroke-opacity="0.16"/>
  <text x="94" y="569" font-family="'Menlo', 'DejaVu Sans Mono', monospace"
        font-size="18" fill="#f2f2f0"><tspan fill="#6b6b6b">$ </tspan>pip install calibra-robotics</text>

  <!-- GitHub pill -->
  <rect x="1000" y="536" width="128" height="52" rx="26" fill="none" stroke="#f5f5f5" stroke-opacity="0.22"/>
  <text x="1064" y="569" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="600" font-size="17" fill="#f2f2f0">GitHub</text>
</svg>
